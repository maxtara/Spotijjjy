
service: spotijjjy

# Plugins
plugins:
  - serverless-python-requirements

# Provider
provider:
  name: aws
  runtime: python3.8
  stage: dev
  region: ap-southeast-2
  timeout: 180 # optional, in seconds, default is 6
  versionFunctions: false # optional, default is true
  # Alerting: the Lambda publishes here when the Spotify refresh token expires.
  environment:
    ALERT_SNS_TOPIC_ARN:
      Ref: AlertTopic
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:DeleteItem # used to discard an expired refresh token
      Resource:
        - ${file(./secrets.json):TABLE_ARN}
    - Effect: Allow
      Action:
        - sns:Publish
      Resource:
        - Ref: AlertTopic

# Package (zip file with code)
package:
  individually: false
  include:
    - './spotijjjy/*.py'
    - './*.json'
  exclude:
    - '**'

# Functions
functions:
  doublej:
    handler: spotijjjy.main.main
    environment:
      CONFIG_FILE: 'personal_config.json'
      STATION_ID: 'abc:doublej'
      PLAYLIST_ID: ${file(./secrets.json):DJ_PLAYLIST_ID}
      STORE: "dydb:general"
    events:
       - schedule: cron(0 2 * * ? *)
  triplej:
    handler: spotijjjy.main.main
    environment:
      CONFIG_FILE: 'personal_config.json'
      STATION_ID: 'abc:triplej'
      PLAYLIST_ID: ${file(./secrets.json):TJ_PLAYLIST_ID}
      STORE: "dydb:general"
    events:
       - schedule: cron(10 2 * * ? *)
  jazz:
    handler: spotijjjy.main.main
    environment:
      CONFIG_FILE: 'personal_config.json'
      STATION_ID: 'abc:jazz'
      PLAYLIST_ID: ${file(./secrets.json):JA_PLAYLIST_ID}
      STORE: "dydb:general"
    events:
       - schedule: cron(20 2 * * ? *)
  redditw:
    handler: spotijjjy.main.main
    environment:
      CONFIG_FILE: 'personal_config.json'
      STATION_ID: 'reddit:listentothis'
      RANGES: 'week,100'
      PLAYLIST_ID: ${file(./secrets.json):RW_PLAYLIST_ID}
      STORE: "dydb:general"
    events:
       - schedule: cron(30 0 ? * MON *)
  redditd:
    handler: spotijjjy.main.main
    environment:
      CONFIG_FILE: 'personal_config.json'
      STATION_ID: 'reddit:listentothis'
      RANGES: 'day,100'
      PLAYLIST_ID: ${file(./secrets.json):RD_PLAYLIST_ID}
      STORE: "dydb:general"
    events:
       - schedule: cron(40 0 * * ? *)
  redditm:
    handler: spotijjjy.main.main
    environment:
      CONFIG_FILE: 'personal_config.json'
      STATION_ID: 'reddit:listentothis'
      RANGES: 'month,100'
      PLAYLIST_ID: ${file(./secrets.json):RM_PLAYLIST_ID}
      STORE: "dydb:general"
    events:
       - schedule: cron(50 0 1 * ? *)


# Custom. This removes pulling boto3 into the zip (as AWS comes with it)
custom:
  pythonRequirements:
    noDeploy:
      - boto3

# Resources: a single SNS topic + email subscription used for "re-auth required" alerts.
# This stays within the AWS always-free usage tier for the handful of alerts/year this
# sends. Put your email in secrets.json as ALERT_EMAIL (you'll get a one-time
# "Confirm subscription" email from AWS - click it once).
resources:
  Resources:
    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: spotijjjy-alerts
        DisplayName: Spotijjjy
    AlertEmailSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn:
          Ref: AlertTopic
        Protocol: email
        Endpoint: ${file(./secrets.json):ALERT_EMAIL}